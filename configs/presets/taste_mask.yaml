# Product preset: thin taste-mask coat on small cores. Values are example assumptions.
pellet:
  core_median_um: 250.0   # Small-core preset (Wolfgang et al. 2025 core range)
coating:
  n: 1.40                 # Assumption: porous film, lower index (Lin et al. 2017 range 1.30-1.60)
batch:
  target_mean_um: 8.0     # Assumption: thin taste-mask coat
  duration_h: 6.0         # Assumption: shorter spray time for the thin coat
spec:
  d10_min_um: 6.0         # Assumption: example spec for this preset
