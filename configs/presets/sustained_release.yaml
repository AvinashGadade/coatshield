# Product preset: sustained-release coat (ethylcellulose class). Values are example assumptions.
pellet:
  core_median_um: 700.0   # Core sizes used in Wolfgang et al. 2025
coating:
  n: 1.47                 # Assumption: ethylcellulose film, within the 1.30-1.60 range (Lin et al. 2017)
batch:
  target_mean_um: 20.0    # Assumption: thicker functional coat than the enteric example
  duration_h: 15.0        # Assumption: longer spray time to reach the thicker target
spec:
  d10_min_um: 15.0        # Assumption: example spec for this preset
